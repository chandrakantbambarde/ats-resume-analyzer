<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ATSScan - AI Resume Analyzer</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

  <!-- Bootstrap Icons only (CSS नाही - dark theme शी conflict होतं) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <style>
    /* ✅ Body ला dark background - Bootstrap override */
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      background-color: #09090f !important;
      color: #e2e8f0 !important;
      margin: 0;
      padding: 0;
      width: 100%;
      overflow-x: hidden;
      font-family: 'DM Sans', sans-serif;
    }
    /* Bootstrap चा white background override */
    .bg-light { background-color: #09090f !important; }
    .text-muted { color: #64748b !important; }
    .container-fluid { padding: 0 !important; }
  </style>
</head>
<body>
  <app-root></app-root>

  <!-- Bootstrap JS (components साठी ठेवतो) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
